# dsh-mcp-manager bundle 自带的补丁层（`package.json` 的 `dsh.bundle.patch` 指向本文件）。
#
# v0.4.0 起这里**只有插件自己这一行**：每台 MCP 都是用户 profile `cordis.patch.yml`
# 里的普通顶层 Loader 条目（与手写、市场插件写的完全同形），插件按 id 原地增删改那些行，
# 不再需要任何容器条目。v0.2/v0.3 的 `cordis:group` 容器（id: mcp-manager）随之退役——
# 旧数据由页面里的「迁移为顶层条目」一次性搬出，之后卸载插件零痕迹、配置随时可手工维护。
#
# ⚠️ 插件行必须写在 `insert:` 下，**不能**写成顶层的 `- id: X`：顶层 `- id: X` 是"覆写已存在
#    条目"，目标不存在时 `applyEntryPatches` 直接 warn 并丢弃（README 2.3）——那样插件根本
#    不会出现，表现就是"设置里没有 MCP 页"。自检 P3 钉住"插件行在 insert 里"。
- insert:
    - id: dsh-mcp-manager # Loader 条目 id（profile 里的 include:dsh-mcp-manager 就是它）
      name: '@qq540491950/dsh-mcp-manager' # 必须等于 package.json 的 name（自检 P4）
