<!--
  MCP 官方标记（Model Context Protocol）——三联弧线笔画。

  几何**逐字取自官方仓库** modelcontextprotocol/modelcontextprotocol 的 `docs/favicon.svg`：
  里面那三条 `stroke-width="11.0667"` + `stroke-linecap="round"` 的 <path>，路径数据未做任何改动；
  这里只加了一层 `translate + scale`，把它按官方比例塞进 16x16 的导航图标格：

      墨迹高 15 / 宽 13.4851（居中：左右各 1.2575、上下各 0.5）
      scale = 0.0942473（= 15 / 159.1557，159.1557 是原图含描边后的墨迹高）
      有效描边 = 10.61038 * 0.0942473 = 1.0

  描边为什么取 1.0、而不是官方自然比例 1.043：16px 下笔画之间的缝只有约 1px，
  4% 的加粗就会把缝糊死（实测覆盖率从 0.169 跳到 0.242）。1.0 是「还看得见缝」的那一档。

  颜色用 currentColor：本文件同时用于两处——CSS mask（只取 alpha，data URI 里
  currentColor 会退化成初始色，颜色由 `background-color:currentColor` 提供）与将来的内联 SVG。

  自检（tools/verify.ts A32/A33）会逐字比对本文件与 lib/client.js 里内联的那份，防止两边漂移。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round">
  <g transform="translate(-0.44525 -0.50229) scale(0.0942473)" stroke-width="10.61038">
