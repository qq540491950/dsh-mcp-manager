<!--
  bundle 卡片图标（`package.json` 的 `icon` 指向本文件）。

  为什么另画一个、不复用 assets/mcp-mark.svg：那份是给 CSS mask 用的**纯笔画**标记
  （`stroke="currentColor"`、16x16）；当卡片图标用时没有 CSS 继承，`currentColor` 会退化成
  初始黑，且没有底色，在深浅两套主题下都显得很淡（publish-plan §3.3）。

  这里做两件事，**一个字都没有改标记本身的几何**：
    1. 三条 <path> 的 `d` 与 assets/mcp-mark.svg **逐字相同**（自检 P8 会逐字比对）；
       里面那层 `<g transform=... stroke-width="10.61038">` 也原样保留。
    2. 外面套一层 `<g transform="translate(32 32) scale(2.26667) translate(-8 -8)">`，把 16x16 里
       居中的墨迹（x 1.2575–14.7425、y 0.5–15.5，中心 (8,8)）等比放大 2.26667 倍后仍在 (32,32) 居中，
       墨迹高 15 × 2.26667 = 34px，四周留白 → 做成 64x64 的圆角底色块。

  颜色是 SVG **资产**里的写死值（不是渲染进 DOM 的样式）：静态图标拿不到主题 token，
  这一点与 AGENTS 3.1「客户端渲染不硬编码颜色」不冲突——A11 只扫客户端产物 lib/client.js。
  底色取 indigo-9 `#3E63DD`：在白底与深色底（#0f1115 一档）上都够醒目；标记取纯白。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#3E63DD" />
  <g transform="translate(32 32) scale(2.26667) translate(-8 -8)" stroke="#FFFFFF" stroke-linecap="round">
    <g transform="translate(-0.44525 -0.50229) scale(0.0942473)" stroke-width="10.61038">
      <path d="M23.5996 85.2532L86.2021 22.6507C94.8457 14.0071 108.86 14.0071 117.503 22.6507C126.147 31.2942 126.147 45.3083 117.503 53.9519L70.2254 101.23" />
      <path d="M70.8789 100.578L117.504 53.952C126.148 45.3083 140.163 45.3083 148.806 53.952L149.132 54.278C157.776 62.9216 157.776 76.9357 149.132 85.5792L92.5139 142.198C89.6327 145.079 89.6327 149.75 92.5139 152.631L104.14 164.257" />
      <path d="M101.853 38.3013L55.553 84.6011C46.9094 93.2447 46.9094 107.258 55.553 115.902C64.1966 124.546 78.2106 124.546 86.8543 115.902L133.154 69.6025" />
    </g>
  </g>
</svg>
